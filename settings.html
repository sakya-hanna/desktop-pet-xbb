<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模型设置</title>
  <link rel="stylesheet" href="settings.css">
  <script src="settings.js" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">白姐 · AI</p><h1>模型设置</h1><p>连接兼容 OpenAI 的服务。密钥仅存于本机安全存储，不会回显。</p></header>
    <form id="settings-form">
      <p id="store-notice" role="alert" hidden></p>
      <label for="base-url">API 地址（Base URL）</label>
      <input id="base-url" type="url" placeholder="https://api.example.com/v1" autocomplete="off" maxlength="2048" required disabled>
      <label for="model">模型名称</label>
      <input id="model" type="text" placeholder="填写服务提供的模型 ID" autocomplete="off" maxlength="200" required disabled>
      <div class="label-row"><label for="api-key">API 密钥</label><span id="key-status">读取中…</span></div>
      <input id="api-key" type="password" placeholder="留空保留已有密钥" autocomplete="new-password" maxlength="4096" aria-describedby="key-help" disabled>
      <p id="key-help" class="hint">留空不会删除已有密钥。填写新密钥后点击保存以替换。</p>
      <label class="checkbox"><input id="remove-key" type="checkbox" disabled>明确删除已保存的密钥</label>
      <div class="actions"><button id="save" type="submit" disabled>保存设置</button><button id="test" type="button" disabled>测试已保存的连接</button></div>
      <p class="hint">测试仅使用已保存的设置；修改后请先保存。测试会向该服务发送请求。</p>
      <p id="status" role="status" aria-live="polite">正在读取设置…</p>
    </form>
  </main>
</body>
</html>
