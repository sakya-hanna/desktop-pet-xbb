<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>白姐 · 视频片段测试</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent; }
  #wrap { position:absolute; left:0; right:0; bottom:0; height:100%; display:flex; align-items:flex-end; justify-content:center; }
  #clip {
    width: 240px;              /* 和桌宠窗口同宽 */
    height: 320px;             /* 3:4 */
    display: block;
    pointer-events: none;
    image-rendering: auto;
  }
</style>
</head>
<body>
  <div id="wrap">
    <video id="clip" src="../petpack/pet/baijie-animation/待机呼吸.webm"
           autoplay muted loop playsinline></video>
  </div>
  <script>
    const v = document.getElementById('clip');
    v.addEventListener('loadeddata', () => {
      console.log('CLIP_READY', v.videoWidth, v.videoHeight, v.duration);
    });
    v.addEventListener('error', () => console.log('CLIP_ERROR', v.error && v.error.code));
    setTimeout(() => {
      const r = v.getBoundingClientRect();
      console.log('RECT', JSON.stringify({w: r.width, h: r.height, left: r.left, top: r.top}),
                  'win', window.innerWidth, window.innerHeight, 'dpr', window.devicePixelRatio);
    }, 800);
  </script>
</body>
</html>
