<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>后发弯曲测试</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#eef2f7; }
  #stage { position:relative; width:100%; height:100%; }
  .layer { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; }

  /* 头发链：8 段，每段都显示同一张图，用 clip-path 只露出自己那一条 */
  .seg {
    position:absolute; inset:0;
    will-change: transform;
  }
  .seg img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
</style>
</head>
<body>
  <div id="stage">
    <!-- 1) 后发（最底层） -->
    <div id="hair">
      <div class="seg" id="seg0"><img src="layers-v3/back_hair.png" /></div>
      <div class="seg" id="seg1"><img src="layers-v3/back_hair.png" /></div>
      <div class="seg" id="seg2"><img src="layers-v3/back_hair.png" /></div>
      <div class="seg" id="seg3"><img src="layers-v3/back_hair.png" /></div>
      <div class="seg" id="seg4"><img src="layers-v3/back_hair.png" /></div>
      <div class="seg" id="seg5"><img src="layers-v3/back_hair.png" /></div>
      <div class="seg" id="seg6"><img src="layers-v3/back_hair.png" /></div>
      <div class="seg" id="seg7"><img src="layers-v3/back_hair.png" /></div>
    </div>
    <!-- 2) 身体 -->
    <img class="layer" src="layers-v3/neck.png" />
    <img class="layer" src="layers-v3/legwear.png" />
    <img class="layer" src="layers-v3/footwear.png" />
    <img class="layer" src="layers-v3/bottomwear.png" />
    <img class="layer" src="layers-v3/topwear.png" />
    <img class="layer" src="layers-v3/handwear.png" />
    <!-- 3) 头 -->
    <div id="head">
      <img class="layer" src="layers-v3/ears.png" />
      <img class="layer" src="layers-v3/face.png" />
      <img class="layer" src="layers-v3/eyebrow.png" />
      <img class="layer" src="layers-v3/eyewhite.png" />
      <img class="layer" src="layers-v3/irides.png" />
      <img class="layer" src="layers-v3/eyelash_top.png" />
      <img class="layer" src="layers-v3/eyelash_bot.png" />
      <img class="layer" src="layers-v3/nose.png" />
      <img class="layer" src="layers-v3/mouth.png" />
      <img class="layer" src="layers-v3/front_hair.png" />
    </div>
  </div>
  <script src="hair-test.js"></script>
</body>
</html>
