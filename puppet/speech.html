<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>白姐 · 对话</title>
  <link rel="stylesheet" href="speech.css">
  <script src="speech.js" defer></script>
</head>
<body>
  <section class="speech" aria-label="白姐的对话">
    <header><span>白姐</span><button type="button" id="speech-close" aria-label="关闭对话">×</button></header>
    <div id="speech-text" role="status" aria-live="polite" tabindex="0"></div>
  </section>
</body>
</html>
